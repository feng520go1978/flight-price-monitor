name: Flight Price Monitor

on:
  schedule:
    # 每天 01:00 / 07:00 / 13:00 / 19:00 UTC（北京时间 09/15/21/03 点）
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      from_code:
        description: '出发地三字码 (如 CTU)'
        required: true
        default: 'CTU'
      from_name:
        description: '出发地名称 (如 成都)'
        required: true
        default: '成都'
      to_code:
        description: '目的地三字码 (如 XMN)'
        required: true
        default: 'XMN'
      to_name:
        description: '目的地名称 (如 厦门)'
        required: true
        default: '厦门'
      depart_dates:
        description: '去程日期, 逗号分隔 (如 2026-11-07,2026-11-08)'
        required: true
        default: '2026-11-07,2026-11-08'
      return_dates:
        description: '回程日期, 逗号分隔 (可选, 单程留空)'
        required: false
        default: ''
      platforms:
        description: '平台: ctrip,tongcheng,qunar,tuniu,fliggy'
        required: false
        default: 'ctrip,tongcheng,qunar'
      threshold:
        description: '低价提醒阈值（元）'
        required: false
        default: '500'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Build config from workflow_dispatch or defaults
        env:
          IN_FROM_CODE: ${{ inputs.from_code }}
          IN_FROM_NAME: ${{ inputs.from_name }}
          IN_TO_CODE: ${{ inputs.to_code }}
          IN_TO_NAME: ${{ inputs.to_name }}
          IN_DATES: ${{ inputs.depart_dates }}
          IN_RETURNS: ${{ inputs.return_dates }}
          IN_PLATFORMS: ${{ inputs.platforms }}
          IN_THRESHOLD: ${{ inputs.threshold }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          python scripts/build_config.py \
            --from-code "${IN_FROM_CODE:-CTU}" \
            --from-name "${IN_FROM_NAME:-成都}" \
            --to-code "${IN_TO_CODE:-XMN}" \
            --to-name "${IN_TO_NAME:-厦门}" \
            --dates "${IN_DATES:-2026-11-07,2026-11-08}" \
            --return-dates "${IN_RETURNS:-}" \
            --platforms "${IN_PLATFORMS:-ctrip,tongcheng,qunar,tuniu}" \
            --threshold "${IN_THRESHOLD:-500}" \
            --serverchan-key "${SERVERCHAN_KEY:-}" \
            --output config.yaml

      - name: Run price monitor (one round)
        run: python main.py --once
        timeout-minutes: 15

      - name: Export latest results to JSON
        run: |
          mkdir -p docs/data
          python scripts/export_results.py \
            --db data/prices.db \
            --out docs/data/latest.json

      - name: Render HTML report
        run: |
          python scripts/render_report.py \
            --results-file docs/data/latest.json \
            --out-dir docs/data

      - name: Print price summary
        if: always()
        run: |
          echo "## 本轮抓取结果" >> "$GITHUB_STEP_SUMMARY"
          if [ -f docs/data/latest.json ]; then
            jq -r '.data.summary[] | "**\(.from) → \(.to)　\(.date)**　最低 **¥\(.min_price)**　（\(.best_platform)　\(.best_flight)　\(.best_depart_time)-\(.best_arrive_time)）\n\n各平台：\(.per_platform | to_entries | map("\(.key)=¥\(.value)") | join("　·　"))\n"' docs/data/latest.json >> "$GITHUB_STEP_SUMMARY" || echo "解析 latest.json 失败" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "latest.json 未生成（本轮无数据）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit data & report
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # .gitignore 里的 data/ 会把 docs/data/ 也忽略掉，必须 -f 强制加入
          git add -f docs/data/
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update price data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main || {
            echo "::warning::直接推送失败，rebase 后重试一次"
            git pull --rebase origin main
            git push origin HEAD:main
          }
